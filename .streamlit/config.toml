[server]
headless = true
# XSRF protection stays on; it works through Railway's proxy and setting
# enableCORS=false alongside it is ignored by Streamlit anyway.
enableXsrfProtection = true
maxUploadSize = 50

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#7C5CFF"
backgroundColor = "#08080C"
secondaryBackgroundColor = "#12121A"
textColor = "#ECECF1"
font = "sans serif"
